name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # The VPS host key is pinned via the VPS_SSH_HOST_KEY secret (a known_hosts
      # line or OpenSSH public key material supplied by an admin). Host-key rotation
      # requires updating that secret through a trusted channel. Deployment
      # verification is pending until the secret is set; the job fails without it.
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_KEY_B64 VPS_SSH_HOST_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required secret $name is not set; refusing to connect."
              exit 1
            fi
          done

          umask 077
          mkdir -p ~/.ssh
          KNOWN_HOSTS="$HOME/.ssh/known_hosts"

          case "$VPS_SSH_HOST_KEY" in
            ssh-*|ecdsa-*|sk-*)
              printf '%s %s\n' "$VPS_HOST" "$VPS_SSH_HOST_KEY" > "$KNOWN_HOSTS"
              ;;
            *)
              printf '%s\n' "$VPS_SSH_HOST_KEY" > "$KNOWN_HOSTS"
              ;;
          esac
          chmod 600 "$KNOWN_HOSTS"

          if ! ssh-keygen -l -f "$KNOWN_HOSTS" >/dev/null 2>&1; then
            echo "::error::VPS_SSH_HOST_KEY is not a valid known_hosts line or OpenSSH public key."
            exit 1
          fi
          if ! ssh-keygen -F "$VPS_HOST" -f "$KNOWN_HOSTS" >/dev/null; then
            echo "::error::VPS_SSH_HOST_KEY has no entry matching VPS_HOST."
            exit 1
          fi

          echo "$VPS_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS" \
            -o GlobalKnownHostsFile=/dev/null \
            -o UpdateHostKeys=no \
            "$VPS_USER@$VPS_HOST" 'bash /var/www/dish2door.store/deploy.sh'
